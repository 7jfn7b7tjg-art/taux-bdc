name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.3.0) — used when run manually"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  test-swift:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift engine tests
        run: ./scripts/test_macos.sh

  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

  build-macos:
    needs: test-swift
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SwiftUI app
        run: |
          xcodebuild \
            -project macos/TauxBdC/TauxBdC.xcodeproj \
            -target TauxBdC \
            -configuration Release \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad hoc sign
        run: |
          APP="macos/TauxBdC/build/Release/Taux BdC.app"
          ls -la "$(dirname "$APP")"
          codesign --force --deep -s - "$APP"
          codesign -dv "$APP"

      - name: Package ZIP
        run: |
          STAGE=stage
          mkdir -p "$STAGE" dist
          cp -R "macos/TauxBdC/build/Release/Taux BdC.app" "$STAGE/"
          cp packaging/LISEZ-MOI-macOS.txt "$STAGE/LISEZ-MOI.txt"
          cp packaging/modele_lot.csv "$STAGE/"
          ditto -c -k --sequesterRsrc "$STAGE" dist/Taux-BdC-macOS.zip
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taux-BdC-macOS
          path: dist/Taux-BdC-macOS.zip

  build-windows:
    needs: test-python
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build binary
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Taux-BdC --hidden-import openpyxl --collect-submodules openpyxl gui_taux_bdc.py

      - name: Package ZIP
        shell: pwsh
        run: |
          $stage = "dist/windows-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/Taux-BdC.exe" $stage
          Copy-Item "packaging/LISEZ-MOI-Windows.txt" "$stage/LISEZ-MOI.txt"
          Copy-Item "packaging/modele_lot.csv" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Taux-BdC-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taux-BdC-Windows
          path: dist/Taux-BdC-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Taux-BdC-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Taux-BdC-Windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Taux BdC ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/Taux-BdC-macOS.zip
            artifacts/Taux-BdC-Windows.zip
          body: |
            ## Downloads / Téléchargements

            | Platform | File |
            |----------|------|
            | macOS (native SwiftUI app) | `Taux-BdC-macOS.zip` |
            | Windows | `Taux-BdC-Windows.zip` |

            No Python required. Single + batch conversions (CSV/XLSX/JSON/XML), FR/EN, audit history.

            **macOS:** open `Taux BdC.app` (right-click → Open if Gatekeeper blocks).
            **Windows:** open `Taux-BdC.exe` (SmartScreen → More info → Run anyway if needed).

            Batch template columns: `date`, `devise`, `montant`, `reference` (`modele_lot.csv` included).

            Source: Bank of Canada Valet API — rates are indicative only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
