name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0) — used when run manually"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build binary
        run: |
          python -m PyInstaller \
            --noconfirm --clean --onefile --windowed \
            --name Taux-BdC \
            --hidden-import openpyxl \
            --collect-submodules openpyxl \
            gui_taux_bdc.py

      - name: Package ZIP
        run: |
          STAGE=dist/macos-stage
          mkdir -p "$STAGE"
          if [ -d dist/Taux-BdC.app ]; then
            cp -R dist/Taux-BdC.app "$STAGE/"
          elif [ -f dist/Taux-BdC ]; then
            cp dist/Taux-BdC "$STAGE/"
          else
            echo "No macOS build artifact found" >&2
            ls -la dist
            exit 1
          fi
          cp "packaging/Ouvrir Taux BdC.command" "$STAGE/"
          cp packaging/LISEZ-MOI-macOS.txt "$STAGE/LISEZ-MOI.txt"
          cp packaging/modele_lot.csv "$STAGE/"
          chmod +x "$STAGE/Ouvrir Taux BdC.command" || true
          chmod +x "$STAGE/Taux-BdC" 2>/dev/null || true
          cd "$STAGE"
          zip -r ../Taux-BdC-macOS.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taux-BdC-macOS
          path: dist/Taux-BdC-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build binary
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Taux-BdC --hidden-import openpyxl --collect-submodules openpyxl gui_taux_bdc.py

      - name: Package ZIP
        shell: pwsh
        run: |
          $stage = "dist/windows-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/Taux-BdC.exe" $stage
          Copy-Item "packaging/LISEZ-MOI-Windows.txt" "$stage/LISEZ-MOI.txt"
          Copy-Item "packaging/modele_lot.csv" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Taux-BdC-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taux-BdC-Windows
          path: dist/Taux-BdC-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Taux-BdC-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Taux-BdC-Windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Taux BdC ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/Taux-BdC-macOS.zip
            artifacts/Taux-BdC-Windows.zip
          body: |
            ## Downloads / Téléchargements

            | Platform | File |
            |----------|------|
            | macOS | `Taux-BdC-macOS.zip` |
            | Windows | `Taux-BdC-Windows.zip` |

            Desktop app (no Python). Single conversion + batch CSV/Excel.

            **macOS:** open `Taux-BdC.app` or `Ouvrir Taux BdC.command` (right-click → Open if Gatekeeper blocks).
            **Windows:** open `Taux-BdC.exe` (SmartScreen → More info → Run anyway if needed).

            Batch template columns: `date`, `devise`, `montant`, `reference` (`modele_lot.csv` included).

            Source: Bank of Canada Valet API — rates are indicative only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
